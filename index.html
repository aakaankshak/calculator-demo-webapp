<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pink Calculator</title>
  <style>
    :root {
      --bg: #ffe4ec;
      --body: #ffc2d4;
      --key: #fff0f5;
      --key-text: #8a1c42;
      --op: #ff85a2;
      --accent: #d6336c;
      --accent-dark: #b02a58;
      --screen: #fff8fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    .calc {
      width: 320px;
      max-width: 94vw;
      padding: 20px;
      background: var(--body);
      border-radius: 28px;
      box-shadow: 0 14px 30px rgba(214, 51, 108, 0.35);
    }
    .screen {
      background: var(--screen);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 84px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }
    #expr { color: #c46a88; font-size: 16px; min-height: 22px; word-break: break-all; }
    #result { color: var(--key-text); font-size: 34px; font-weight: bold; min-height: 42px; word-break: break-all; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button {
      border: none;
      border-radius: 14px;
      padding: 16px 0;
      font-size: 20px;
      font-family: inherit;
      background: var(--key);
      color: var(--key-text);
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(176, 42, 88, 0.25);
    }
    button:hover { filter: brightness(0.95); }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .op { background: var(--op); color: #fff; }
    .clear { background: var(--accent); color: #fff; }
    .wide { grid-column: span 2; }
    .equals { grid-column: span 4; background: var(--accent-dark); color: #fff; }
  </style>
</head>
<body>
  <main class="calc">
    <div class="screen">
      <div id="expr"></div>
      <div id="result">0</div>
    </div>
    <div class="keys">
      <button class="clear wide" data-action="clear">AC</button>
      <button class="op" data-action="delete" aria-label="Delete last">&#10005;</button>
      <button class="op" data-value="/">&divide;</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="op" data-value="*">&times;</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="op" data-value="-">&minus;</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="op" data-value="+">+</button>

      <button data-value="(">(</button>
      <button data-value=")">)</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>

      <button class="equals" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const exprEl = document.getElementById("expr");
    const resultEl = document.getElementById("result");
    let expr = "";

    function show() {
      exprEl.textContent = expr
        .replace(/\*/g, "\u00d7")
        .replace(/\//g, "\u00f7")
        .replace(/-/g, "\u2212");
    }

    function calculate() {
      if (!expr) return;
      try {
        // Only buttons can add characters, but check anyway
        if (!/^[0-9+\-*/().%\s]+$/.test(expr)) throw new Error("bad input");
        const value = Function('"use strict"; return (' + expr.replace(/%/g, "/100") + ")")();
        if (!Number.isFinite(value)) throw new Error("math error");
        resultEl.textContent = String(Math.round(value * 1e10) / 1e10);
        expr = resultEl.textContent;
        show();
      } catch (e) {
        resultEl.textContent = "Error";
        expr = "";
        show();
      }
    }

    document.querySelector(".keys").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === "clear") {
        expr = "";
        resultEl.textContent = "0";
      } else if (action === "delete") {
        expr = expr.slice(0, -1);
      } else if (action === "equals") {
        calculate();
        return;
      } else {
        if (resultEl.textContent === "Error") resultEl.textContent = "0";
        expr += btn.dataset.value;
      }
      show();
    });
  </script>
</body>
</html>
